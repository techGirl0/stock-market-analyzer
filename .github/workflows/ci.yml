name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_market_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/stock_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff mypy pip-audit
      - run: ruff check backend/app backend/tests
      - run: mypy --config-file backend/pyproject.toml backend/app
      - run: python -m pytest backend/tests -q
      - run: python -m behave features/manage_watchlist.feature
        env:
          PYTHONPATH: backend
      - run: pip-audit -r backend/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
