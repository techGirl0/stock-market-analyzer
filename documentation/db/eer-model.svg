    <rect x="390" y="600" width="220" height="32" fill="#d97706" rx="6"/>
    <rect x="390" y="620" width="220" height="12" fill="#d97706"/>
    <text x="500" y="621" text-anchor="middle" font-size="13" font-weight="bold" fill="white">portfolio_holdings</text>
