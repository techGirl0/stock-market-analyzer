  <!-- ══════════════════════════════════════════════════
       RELATIONSHIP LINES (crow's foot style)
  ════════════════════════════════════════════════════ -->

  <!-- users → refresh_tokens (1:N) -->
  <!-- users left side x=390, y≈145  →  refresh_tokens right x=250, y≈148 -->
  <line x1="390" y1="148" x2="250" y2="148" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- crow foot (many) at right_tokens side -->
  <line x1="258" y1="142" x2="250" y2="148" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="258" y1="154" x2="250" y2="148" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="264" y1="148" x2="258" y2="148" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- one side at users -->
  <line x1="390" y1="142" x2="390" y2="154" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="142" font-size="10" fill="#7c3aed" font-style="italic">1 : N</text>

  <!-- users → watchlists (1:N) -->
  <!-- users bottom x=440, y=210  →  watchlists top x=140, y=320 routed via elbow -->
  <polyline points="440,210 440,270 140,270 140,320" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="134" y1="314" x2="140" y2="320" stroke="#059669" stroke-width="1.5"/>
  <line x1="146" y1="314" x2="140" y2="320" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="313" x2="140" y2="320" stroke="#059669" stroke-width="1.5"/>
  <line x1="434" y1="210" x2="446" y2="210" stroke="#059669" stroke-width="1.5"/>
  <text x="265" y="262" font-size="10" fill="#059669" font-style="italic">1 : N</text>

  <!-- watchlists → watchlist_items (1:N) -->
  <line x1="140" y1="450" x2="140" y2="560" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="134" y1="554" x2="140" y2="560" stroke="#059669" stroke-width="1.5"/>
  <line x1="146" y1="554" x2="140" y2="560" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="554" x2="140" y2="560" stroke="#059669" stroke-width="1.5"/>
  <line x1="134" y1="450" x2="146" y2="450" stroke="#059669" stroke-width="1.5"/>
  <text x="148" y="510" font-size="10" fill="#059669" font-style="italic">1 : N</text>

  <!-- users → portfolios (1:N) -->
  <!-- users bottom x=500, y=210  →  portfolios top x=500, y=380 -->
  <line x1="500" y1="210" x2="500" y2="380" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="494" y1="374" x2="500" y2="380" stroke="#d97706" stroke-width="1.5"/>
  <line x1="506" y1="374" x2="500" y2="380" stroke="#d97706" stroke-width="1.5"/>
  <line x1="500" y1="374" x2="500" y2="380" stroke="#d97706" stroke-width="1.5"/>
  <line x1="494" y1="210" x2="506" y2="210" stroke="#d97706" stroke-width="1.5"/>
  <text x="508" y="300" font-size="10" fill="#d97706" font-style="italic">1 : N</text>

  <!-- portfolios → portfolio_holdings (1:N) -->
  <line x1="500" y1="510" x2="500" y2="600" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="494" y1="594" x2="500" y2="600" stroke="#d97706" stroke-width="1.5"/>
  <line x1="506" y1="594" x2="500" y2="600" stroke="#d97706" stroke-width="1.5"/>
  <line x1="500" y1="594" x2="500" y2="600" stroke="#d97706" stroke-width="1.5"/>
  <line x1="494" y1="510" x2="506" y2="510" stroke="#d97706" stroke-width="1.5"/>
  <text x="508" y="560" font-size="10" fill="#d97706" font-style="italic">1 : N</text>

  <!-- users → price_alerts (1:N) -->
  <!-- users right x=610, y=145  →  price_alerts left x=850, y=368 routed via elbow -->
  <polyline points="610,145 730,145 730,370 850,370" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="844" y1="364" x2="850" y2="370" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="844" y1="376" x2="850" y2="370" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="844" y1="370" x2="850" y2="370" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="610" y1="139" x2="610" y2="151" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="162" font-size="10" fill="#dc2626" font-style="italic">1 : N</text>

  <!-- price_alerts → alert_deliveries (1:N) -->
  <line x1="960" y1="474" x2="960" y2="580" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="954" y1="574" x2="960" y2="580" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="966" y1="574" x2="960" y2="580" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="960" y1="574" x2="960" y2="580" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="954" y1="474" x2="966" y2="474" stroke="#dc2626" stroke-width="1.5"/>
  <text x="968" y="532" font-size="10" fill="#dc2626" font-style="italic">1 : N</text>

  <!-- ══════════════════════════════════════════════════
       LEGEND
  ════════════════════════════════════════════════════ -->
  <rect x="660" y="80" width="175" height="150" fill="white" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="747" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Legend</text>
  <line x1="675" y1="108" x2="822" y2="108" stroke="#e5e7eb"/>
  <text x="675" y="124" font-size="11" fill="#374151">🔑  Primary Key</text>
  <text x="675" y="142" font-size="11" fill="#374151">🔗  Foreign Key</text>
