    <text x="600" y="648" text-anchor="end" font-size="10" fill="#6b7280">UUID PK</text>
    <line x1="390" y1="654" x2="610" y2="654" stroke="#f3f4f6"/>
    <text x="400" y="670" font-size="11" fill="#374151">🔗 portfolio_id</text>
    <text x="600" y="670" text-anchor="end" font-size="10" fill="#6b7280">UUID FK</text>
    <line x1="390" y1="676" x2="610" y2="676" stroke="#f3f4f6"/>
    <text x="400" y="692" font-size="11" fill="#374151">symbol</text>
