    <text x="600" y="450" text-anchor="end" font-size="10" fill="#6b7280">UUID FK</text>
    <line x1="390" y1="456" x2="610" y2="456" stroke="#f3f4f6"/>
    <text x="400" y="472" font-size="11" fill="#374151">name</text>
