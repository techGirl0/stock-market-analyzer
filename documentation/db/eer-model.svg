    <line x1="850" y1="420" x2="1070" y2="420" stroke="#f3f4f6"/>
    <text x="860" y="436" font-size="11" fill="#374151">threshold</text>
    <text x="1065" y="436" text-anchor="end" font-size="10" fill="#6b7280">REAL</text>
    <line x1="850" y1="442" x2="1070" y2="442" stroke="#f3f4f6"/>
