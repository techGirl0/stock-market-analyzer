    <text x="500" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="white">users</text>
    <!-- columns -->
    <line x1="390" y1="112" x2="610" y2="112" stroke="#e5e7eb"/>
    <text x="400" y="128" font-size="11" fill="#374151">🔑 id</text>
    <text x="600" y="128" text-anchor="end" font-size="10" fill="#6b7280">UUID PK</text>
    <line x1="390" y1="134" x2="610" y2="134" stroke="#f3f4f6"/>
    <text x="400" y="150" font-size="11" fill="#374151">email</text>
    <text x="600" y="150" text-anchor="end" font-size="10" fill="#6b7280">TEXT UNIQUE</text>
